name: Tests MDM
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m mdm demo
      - run: python -m mdm verify
      - run: python -m mdm hospital-demo --workspace workspace_hospital --size 12
      - run: python -m mdm verify --workspace workspace_hospital/S1_5pct
