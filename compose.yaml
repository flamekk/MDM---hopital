services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hospital_mdm
      POSTGRES_USER: mdm_demo
      POSTGRES_PASSWORD: ${MDM_POSTGRES_PASSWORD:?Définir MDM_POSTGRES_PASSWORD dans la session}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - mdm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdm_demo -d hospital_mdm"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  mdm_pgdata:
